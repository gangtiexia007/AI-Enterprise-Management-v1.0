services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boss-ai-backend
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: boss-ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
