<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置向导 - 飞书配置 — 千方百计AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter','system-ui','PingFang SC','Microsoft YaHei','sans-serif'] },
        colors: { brand: {50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'} }
      }}
    }
  </script>
  <style>
    body { font-family: 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
  </style>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-lg animate-fade-in-up">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div>
        <div class="text-lg font-bold text-gray-900">千方百计AI</div>
        <div class="text-xs text-gray-400">智能管理系统</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="flex items-center gap-2 mb-8 px-2">
      <div class="flex items-center gap-2 flex-1">
        <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-bold">✓</div>
        <div class="flex-1 h-1 rounded-full bg-brand-600"></div>
      </div>
      <div class="flex items-center gap-2 flex-1">
        <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-bold">✓</div>
        <div class="flex-1 h-1 rounded-full bg-brand-600"></div>
      </div>
      <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-bold">3</div>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-xl font-bold text-gray-900 mb-1">连接飞书机器人</h1>
      <p class="text-sm text-gray-500 mb-8">配置飞书应用以启用 Boss Agent 对话能力。</p>

      <form method="post" action="/wizard/step3" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">飞书 App ID</label>
          <input type="text" name="feishu_app_id" placeholder="cli_xxxxxxxxxxxxxxxx"
                 class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-100 focus:border-brand-500 outline-none transition-all font-mono text-sm"
                 required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">飞书 App Secret</label>
          <input type="password" name="feishu_app_secret" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
                 class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-100 focus:border-brand-500 outline-none transition-all font-mono text-sm"
                 required>
          <p class="text-xs text-gray-400 mt-2">在飞书开放平台 → 应用管理 → 凭证与基础信息中获取</p>
        </div>

        <!-- What will happen -->
        <div class="rounded-xl bg-gray-50 border border-gray-100 p-4 mt-4">
          <div class="text-xs font-semibold text-gray-500 mb-3">完成后系统将自动：</div>
          <div class="space-y-2">
            <div class="flex items-center gap-2.5 text-sm text-gray-700">
              <div class="w-5 h-5 rounded-full bg-brand-100 flex items-center justify-center flex-shrink-0"><svg class="w-3 h-3 text-brand-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
              创建 Boss Agent（老板专属助手）
            </div>
            <div class="flex items-center gap-2.5 text-sm text-gray-700">
              <div class="w-5 h-5 rounded-full bg-brand-100 flex items-center justify-center flex-shrink-0"><svg class="w-3 h-3 text-brand-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
              绑定飞书机器人到 Boss Agent
            </div>
            <div class="flex items-center gap-2.5 text-sm text-gray-700">
              <div class="w-5 h-5 rounded-full bg-brand-100 flex items-center justify-center flex-shrink-0"><svg class="w-3 h-3 text-brand-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
              配置 LLM 模型并测试连接
            </div>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <a href="/wizard/step2" class="flex-1 px-6 py-3 text-center border border-gray-200 text-gray-600 rounded-xl font-medium hover:bg-gray-50 transition-colors">
            ← 上一步
          </a>
          <button type="submit" class="flex-1 px-6 py-3 bg-brand-600 text-white rounded-xl font-medium hover:bg-brand-700 transition-all shadow-sm shadow-brand-600/20">
            完成设置 ✓
          </button>
        </div>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">千方百计AI · 智能管理系统 v12.0</p>
  </div>
</body>
</html>
