<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建团队 — 设置向导</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' } } } } }</script>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center">
  <div class="w-full max-w-lg mx-4">
    <div class="bg-white border border-gray-200 rounded-lg p-6">
      {% include "wizard/_progress.html" %}

      <h2 class="text-lg font-semibold text-gray-800 mb-1">创建 Agent 团队</h2>
      <p class="text-xs text-gray-400 mb-1">步骤 4 / 7</p>
      <p class="text-sm text-gray-500 mb-5">已选模板: <span class="font-medium text-gray-700">{{ selected_template }}</span></p>

      <form method="post" action="/wizard/step4" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">团队名称 <span class="text-red-500">*</span></label>
          <input type="text" name="team_name" required placeholder="如: 销售一组"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">所属部门</label>
          <input type="text" name="department" placeholder="如: 销售部"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">系统提示词</label>
          <textarea name="system_prompt" rows="4" placeholder="描述这个团队的AI助手应该如何工作..."
                    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none resize-none"></textarea>
          <p class="text-xs text-gray-400 mt-1">可选，后续在团队详情中完善</p>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 mt-6">
          <a href="/wizard/step3" class="px-4 py-2 text-sm border border-gray-300 rounded-md text-gray-600 hover:bg-gray-50">上一步</a>
          <div class="flex items-center gap-4">
            <a href="/wizard/step{{ current_step + 1 }}" class="text-gray-400 hover:text-gray-600 text-sm">跳过此步 →</a>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">下一步</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
