<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器人配置 — 设置向导</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' } } } } }</script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center">
  <div class="w-full max-w-lg mx-4">
    <div class="bg-white border border-gray-200 rounded-lg p-6" x-data="{ channel: 'feishu' }">
      {% include "wizard/_progress.html" %}

      <h2 class="text-lg font-semibold text-gray-800 mb-1">配置 IM 机器人</h2>
      <p class="text-xs text-gray-400 mb-1">步骤 6 / 7</p>
      <p class="text-sm text-gray-500 mb-5">连接飞书/企微机器人，让AI能与员工对话</p>

      <form method="post" action="/wizard/step6" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">通讯渠道</label>
          <div class="flex gap-3">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="channel" value="feishu" x-model="channel" class="text-brand-600">
              <span class="text-sm">飞书</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="channel" value="wecom" x-model="channel" class="text-brand-600">
              <span class="text-sm">企业微信</span>
            </label>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">App ID</label>
          <input type="text" name="app_id" placeholder="cli_xxx"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">App Secret</label>
          <input type="password" name="app_secret"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Webhook URL</label>
          <input type="url" name="webhook_url" placeholder="https://..."
                 class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none">
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 mt-6">
          <a href="/wizard/step5" class="px-4 py-2 text-sm border border-gray-300 rounded-md text-gray-600 hover:bg-gray-50">上一步</a>
          <div class="flex items-center gap-4">
            <a href="/wizard/step{{ current_step + 1 }}" class="text-gray-400 hover:text-gray-600 text-sm">跳过此步 →</a>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">下一步</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
