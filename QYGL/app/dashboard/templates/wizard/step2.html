<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置向导 - LLM 配置 — 千方百计AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter','system-ui','PingFang SC','Microsoft YaHei','sans-serif'] },
        colors: { brand: {50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'} }
      }}
    }
  </script>
  <style>
    body { font-family: 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
  </style>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-lg animate-fade-in-up">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div>
        <div class="text-lg font-bold text-gray-900">千方百计AI</div>
        <div class="text-xs text-gray-400">智能管理系统</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="flex items-center gap-2 mb-8 px-2">
      <div class="flex items-center gap-2 flex-1">
        <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-bold">✓</div>
        <div class="flex-1 h-1 rounded-full bg-brand-600"></div>
      </div>
      <div class="flex items-center gap-2 flex-1">
        <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-bold">2</div>
        <div class="flex-1 h-1 rounded-full bg-gray-200"><div class="h-1 rounded-full bg-brand-600" style="width:50%"></div></div>
      </div>
      <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center text-sm font-bold">3</div>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-xl font-bold text-gray-900 mb-1">配置 AI 模型</h1>
      <p class="text-sm text-gray-500 mb-8">选择驱动 Boss Agent 的大语言模型。</p>

      <form method="post" action="/wizard/step2" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">模型名称</label>
          <input type="text" name="model_name" value="deepseek-chat" placeholder="例如：deepseek-chat"
                 class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-100 focus:border-brand-500 outline-none transition-all"
                 required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">模型提供商</label>
          <select name="provider" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-100 focus:border-brand-500 outline-none bg-white transition-all">
            <option value="deepseek">DeepSeek</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="qwen">通义千问</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">API Key</label>
          <input type="password" name="api_key" placeholder="sk-..."
                 class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-100 focus:border-brand-500 outline-none transition-all font-mono text-sm"
                 required>
          <p class="text-xs text-gray-400 mt-2">API Key 将加密存储，仅用于调用模型</p>
        </div>

        <div class="flex gap-3 pt-2">
          <a href="/wizard/step1" class="flex-1 px-6 py-3 text-center border border-gray-200 text-gray-600 rounded-xl font-medium hover:bg-gray-50 transition-colors">
            ← 上一步
          </a>
          <button type="submit" class="flex-1 px-6 py-3 bg-brand-600 text-white rounded-xl font-medium hover:bg-brand-700 transition-all shadow-sm shadow-brand-600/20">
            下一步 →
          </button>
        </div>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">千方百计AI · 智能管理系统 v12.0</p>
  </div>
</body>
</html>
