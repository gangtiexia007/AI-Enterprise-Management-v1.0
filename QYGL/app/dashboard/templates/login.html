<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 千方百计AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter','system-ui','PingFang SC','Microsoft YaHei','sans-serif'] },
        colors: { brand: {50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'} }
      }}
    }
  </script>
  <style>
    body { font-family: 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
  </style>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm animate-fade-in-up">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div>
        <div class="text-lg font-bold text-gray-900">千方百计AI</div>
        <div class="text-xs text-gray-400">智能管理系统</div>
      </div>
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
      <h2 class="text-lg font-semibold text-gray-900 mb-1">欢迎回来</h2>
      <p class="text-sm text-gray-500 mb-6">登录你的管理后台</p>

      {% if error %}
      <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-700 flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        {{ error }}
      </div>
      {% endif %}

      {% set ok_msg = request.query_params.get('msg', '') %}
      {% if ok_msg and not error %}
      <div class="mb-4 rounded-xl border border-green-200 bg-green-50 px-4 py-2.5 text-sm text-green-800 flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        {{ ok_msg }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
          <input type="text" id="username" name="username" required autofocus
                 class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"
                 placeholder="请输入用户名">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
          <input type="password" id="password" name="password" required
                 class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"
                 placeholder="请输入密码">
        </div>
        <button type="submit"
                class="w-full rounded-xl bg-brand-600 px-4 py-3 text-sm font-medium text-white hover:bg-brand-700 transition-all shadow-sm shadow-brand-600/20">
          登录
        </button>
      </form>

      <p class="text-xs text-gray-400 text-center mt-5">首次使用默认账号: admin / admin123</p>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">千方百计AI · 智能管理系统</p>
  </div>
</body>
</html>
